name: Publish

on:
  push:
    branches: [main]
  pull_request:

env:
  NO_COLOR: "1"
  COLUMNS: "120"

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 -m pip install -e . pytest
      - run: env -u GITHUB_ACTIONS TERM=dumb python3 -m pytest -q

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 -m pip install build
      - run: python3 -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
